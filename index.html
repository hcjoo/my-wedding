<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>주환철 · 김하정 결혼합니다</title>
  <meta name="description" content="2027년 1월 31일 일요일 오후 3시 30분, 아벤티움 웨딩홀" />

  <!-- 카카오톡/SNS 공유 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="주환철 · 김하정 결혼합니다" />
  <meta property="og:description" content="2027년 1월 31일 일요일 오후 3시 30분, 아벤티움 웨딩홀" />
  <meta property="og:image" content="images/hero.jpg" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="paper">

    <!-- ============ 메인 ============ -->
    <section class="hero">
      <img class="hero__img" id="hero-img" src="" alt="" />
      <div class="hero__shade"></div>
      <div class="hero__top">
        <span id="hero-venue-en"></span>
        <span id="hero-time-en"></span>
      </div>
      <div class="hero__btm">
        <p class="hero__date" id="hero-date"></p>
        <p class="hero__names" id="hero-names"></p>
        <p class="hero__place" id="hero-place"></p>
      </div>
    </section>

    <!-- ============ 인사말 ============ -->
    <section class="band reveal">
      <p class="band__en">INVITATION</p>
      <p class="band__msg" id="greeting-body"></p>
      <div class="band__line"></div>
      <div class="band__parents" id="greeting-parents"></div>
    </section>

    <!-- ============ 갤러리 ============ -->
    <section id="gallery" class="sec reveal">
      <div class="sec__head"><span class="sec__num">01</span><span class="sec__ko">신랑과 신부</span></div>
      <img class="gallery__feature" id="gallery-feature" src="" alt="" />
      <div class="gallery__grid" id="gallery-grid"></div>
    </section>

    <!-- ============ 예식 안내 ============ -->
    <section id="date" class="sec reveal">
      <div class="sec__head"><span class="sec__num">02</span><span class="sec__ko">예식 안내</span></div>
      <p class="date__big" id="date-big"></p>
      <div id="calendar" class="calendar"></div>
      <div id="countdown" class="countdown"></div>
    </section>

    <!-- ============ 오시는 길 ============ -->
    <section id="location" class="sec reveal">
      <div class="sec__head"><span class="sec__num">03</span><span class="sec__ko">오시는 길</span></div>
      <p class="loc__name" id="loc-name"></p>
      <p class="loc__addr" id="loc-addr"></p>
      <p class="loc__tel" id="loc-tel"></p>
      <div class="map">
        <iframe id="map-frame" title="예식장 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="map__buttons" id="map-buttons"></div>
      <div id="transport" class="transport"></div>
    </section>

    <!-- ============ 마음 전하실 곳 ============ -->
    <section id="account" class="sec reveal">
      <div class="sec__head"><span class="sec__num">04</span><span class="sec__ko">마음 전하실 곳</span></div>
      <p class="sec__guide">참석이 어려우신 분들을 위해 계좌번호를 안내드립니다.</p>
      <div id="account-list" class="account"></div>
    </section>

    <!-- ============ 방명록 ============ -->
    <section id="guestbook" class="sec reveal">
      <div class="sec__head"><span class="sec__num">05</span><span class="sec__ko">축하 메시지</span></div>
      <ul id="guestbook-list" class="gb__list"></ul>
      <button id="gb-open" class="btn">메시지 남기기</button>
    </section>

    <footer class="footer">
      <p id="footer-date"></p>
      <p id="footer-names" class="footer__names"></p>
    </footer>
  </main>

  <!-- 방명록 작성 -->
  <div id="gb-modal" class="modal" hidden>
    <div class="modal__box">
      <button class="modal__close" aria-label="닫기">&times;</button>
      <h3>축하 메시지 남기기</h3>
      <form id="guestbook-form">
        <input type="text" id="gb-name" placeholder="이름" maxlength="20" required />
        <textarea id="gb-msg" placeholder="축하 한마디" maxlength="200" required></textarea>
        <button type="submit">남기기</button>
      </form>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" aria-label="닫기">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="이전">&#8249;</button>
    <img id="lightbox-img" src="" alt="" />
    <button class="lightbox__nav lightbox__nav--next" aria-label="다음">&#8250;</button>
    <p class="lightbox__count" id="lightbox-count"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
