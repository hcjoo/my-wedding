<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d8"/>
      <stop offset="0.55" stop-color="#f3ebdd"/>
      <stop offset="1" stop-color="#e7dccb"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#sky)"/>

  <!-- 햇무리 -->
  <circle cx="180" cy="250" r="90" fill="#f7efe1" opacity="0.8"/>
  <circle cx="180" cy="250" r="60" fill="#faf4ea" opacity="0.7"/>

  <!-- 새 -->
  <g stroke="#b89b73" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M70 120 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M250 95 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M285 150 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- 바닥(언덕) -->
  <path d="M0 520 Q180 470 360 520 L360 640 L0 640 Z" fill="#dfd2bd"/>
  <path d="M0 560 Q180 520 360 560 L360 640 L0 640 Z" fill="#d3c3a9"/>

  <!-- 커플 실루엣 -->
  <g transform="translate(180,520)">
    <!-- 신랑 -->
    <g fill="#7d6b4f">
      <circle cx="-26" cy="-150" r="16"/>
      <path d="M-42 -134 q16 -12 32 0 l4 96 q-20 8 -40 0 Z"/>
      <rect x="-30" y="-40" width="8" height="42" rx="3"/>
      <rect x="-12" y="-40" width="8" height="42" rx="3"/>
    </g>
    <!-- 신부 -->
    <g fill="#9a866a">
      <circle cx="24" cy="-150" r="16"/>
      <path d="M8 -132 q16 -10 32 0 l16 132 q-32 10 -64 0 Z"/>
    </g>
    <!-- 맞잡은 손 -->
    <path d="M-6 -90 q6 6 12 0" stroke="#6f5c40" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 풀잎 장식 -->
  <g stroke="#c2a87f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 600 q-6 -40 6 -70"/>
    <path d="M46 560 q-14 -6 -22 -16 M46 545 q14 -6 22 -16"/>
    <path d="M320 600 q6 -40 -6 -70"/>
    <path d="M314 560 q14 -6 22 -16 M314 545 q-14 -6 -22 -16"/>
  </g>
</svg>
